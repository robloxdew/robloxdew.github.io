name: Build Godot iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Game Zip
        run: |
          # ⚠️ 更新为 1.1.0 的新链接
          curl -L -o game.zip "https://github.com/robloxdew/robloxdew.github.io/releases/download/1.1.0/chain.zip"
          echo "====== 下载的文件大小 ======"
          ls -lh game.zip
          file game.zip

      - name: Unzip Game Project
        run: |
          mkdir -p godot_project
          ditto -x -k game.zip godot_project
          echo "====== 解压后的目录结构 ======"
          ls -la godot_project
          echo "====== 查找 project.godot ======"
          find godot_project -name "project.godot"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2-stable
          use-dotnet: false
          include-templates: true

      - name: Fix iOS Config and Export
        run: |
          mkdir -p build
          cd $(dirname $(find godot_project -name "project.godot" | head -n 1))
          
          # ⚠️ 自动确保 iOS 导出配置里有包名，防止因为配置不全报错
          echo "====== 修复前的 export_presets.cfg ======"
          cat export_presets.cfg
          
          if ! grep -q "application/bundle_identifier" export_presets.cfg; then
            sed -i '' '/\[preset.0.options\]/a\
          application/bundle_identifier="com.robloxdew.chain"
          ' export_presets.cfg
          fi
          
          echo "====== 修复后的配置 ======"
          cat export_presets.cfg
          
          # ⚠️ 这个 "iOS" 必须和 Godot 预设名一致
          godot --headless --export-release "iOS" ../../build/chain.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-ipa
          path: build/chain.ipa
          if-no-files-found: error
