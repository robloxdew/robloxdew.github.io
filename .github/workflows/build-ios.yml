name: Build Godot iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Game Zip
        run: |
          curl -L -o game.zip "https://github.com/robloxdew/robloxdew.github.io/releases/download/1.1.0/chain.zip"

      - name: Unzip Game Project
        run: |
          mkdir -p godot_project
          ditto -x -k game.zip godot_project

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2-stable
          use-dotnet: false
          include-templates: true

      - name: Fix Original Config and Export
        run: |
          mkdir -p build
          PROJECT_DIR=$(dirname $(find godot_project -name "project.godot" | head -n 1))
          cd "$PROJECT_DIR"
          echo "当前项目目录: $(pwd)"

          # 1. 使用 sed 精准把错误的 Team ID 改成假的有效值
          sed -i '' 's|application/app_store_team_id=".*"|application/app_store_team_id="ABCDE12345"|g' export_presets.cfg
          
          # 2. 把冲突的包名统一
          sed -i '' 's|application/bundle_identifier=".*"|application/bundle_identifier="com.robloxdew.chain"|g' export_presets.cfg
          
          # 3. 确保签名和描述文件为空（未签名）
          sed -i '' 's|application/code_sign_identity_debug=".*"|application/code_sign_identity_debug=""|g' export_presets.cfg
          sed -i '' 's|application/code_sign_identity_release=".*"|application/code_sign_identity_release=""|g' export_presets.cfg
          sed -i '' 's|application/provisioning_profile_specifier_debug=".*"|application/provisioning_profile_specifier_debug=""|g' export_presets.cfg
          sed -i '' 's|application/provisioning_profile_specifier_release=".*"|application/provisioning_profile_specifier_release=""|g' export_presets.cfg

          echo "========== 修复后的配置关键行 =========="
          grep -E 'name=|bundle_identifier|app_store_team_id|export_path' export_presets.cfg

          echo "========== 开始执行导出 =========="
          # 带 --verbose 获取详细报错信息
          godot --verbose --headless --export-release "iOS" ../../build/chain.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-ipa
          path: build/chain.ipa
          if-no-files-found: error
