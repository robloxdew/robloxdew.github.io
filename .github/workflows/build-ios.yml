name: Build Godot iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Game Zip
        run: |
          curl -L -o game.zip "https://github.com/robloxdew/robloxdew.github.io/releases/download/1.1.0/chain.zip"

      - name: Unzip Game Project
        run: |
          mkdir -p godot_project
          ditto -x -k game.zip godot_project

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2-stable
          use-dotnet: false
          include-templates: true

      - name: Clean Config and Export
        run: |
          mkdir -p build
          PROJECT_DIR=$(dirname $(find godot_project -name "project.godot" | head -n 1))
          cd "$PROJECT_DIR"
          echo "当前项目目录: $(pwd)"

          # 1. 强制删除原配置文件，从零生成新文件
          rm -f export_presets.cfg

          # 2. 生成干净配置。使用 printf 确保没有任何多余的 YAML 缩进。
          printf '%s\n' \
            '[preset.0]' \
            'name="iOS"' \
            'platform="iOS"' \
            'runnable=true' \
            'export_filter="all_resources"' \
            'export_path="../../build/chain.ipa"' \
            '' \
            '[preset.0.options]' \
            'application/bundle_identifier="com.robloxdew.chain"' \
            'application/app_store_team_id="ABCDE12345"' \
            'application/signature=""' \
            'application/code_sign_identity_debug=""' \
            'application/code_sign_identity_release=""' \
            'application/provisioning_profile_specifier_debug=""' \
            'application/provisioning_profile_specifier_release=""' \
            'application/export_method_debug=0' \
            'application/export_method_release=0' \
            'application/targeted_device_family=0' \
            'application/min_ios_version="14.0"' \
            'architectures/arm64=true' \
            > export_presets.cfg

          # 3. 最后用 sed 移除文件行首任何可能残留的空白字符（终极保险）
          sed -i '' 's/^[[:space:]]*//' export_presets.cfg

          echo "========== 检查生成的配置文件 =========="
          cat -A export_presets.cfg | head -n 20

          echo "========== 开始执行导出（带 --verbose 以获取详细报错） =========="
          godot --verbose --headless --export-release "iOS" ../../build/chain.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-ipa
          path: build/chain.ipa
          if-no-files-found: error
