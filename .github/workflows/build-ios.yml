name: Build Godot iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Game Zip
        run: |
          curl -L -o game.zip "https://github.com/robloxdew/robloxdew.github.io/releases/download/1.0.0/chain.zip"

      - name: Unzip Game Project
        run: |
          mkdir -p godot_project
          ditto -x -k game.zip godot_project
          find godot_project -name "project.godot"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2-stable
          use-dotnet: false
          include-templates: true

      - name: Export iOS (Unsigned IPA)
        run: |
          mkdir -p build
          cd $(dirname $(find godot_project -name "project.godot" | head -n 1))
          echo "====== 🔍 打印 export_presets.cfg 内容 ======"
          cat export_presets.cfg
          echo "=========================================="
          # ⚠️ 确保这个 "iOS" 跟你的预设名一致
          godot --headless --export-release "iOS" ../../build/chain.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-ipa
          path: build/chain.ipa
          if-no-files-found: error
