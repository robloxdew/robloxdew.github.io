name: Print iOS Config

on:
  workflow_dispatch:

jobs:
  debug-config:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Game Zip
        run: |
          curl -L -o game.zip "https://github.com/robloxdew/robloxdew.github.io/releases/download/1.1.0/chain.zip"

      - name: Unzip Game Project
        run: |
          mkdir -p godot_project
          ditto -x -k game.zip godot_project
          echo "====== 解压后的目录结构 ======"
          ls -la godot_project
          echo "====== 查找 project.godot ======"
          find godot_project -name "project.godot"

      - name: Print export_presets.cfg
        run: |
          # 进入包含 project.godot 的目录
          cd $(dirname $(find godot_project -name "project.godot" | head -n 1))
          
          echo "====== 当前目录内容 ======"
          ls -la
          
          if [ -f "export_presets.cfg" ]; then
            echo "====== 🔍 export_presets.cfg 完整内容开始 ======"
            cat export_presets.cfg
            echo "====== 🔍 export_presets.cfg 完整内容结束 ======"
          else
            echo "❌ 错误：当前目录下没有找到 export_presets.cfg 文件！"
          fi
