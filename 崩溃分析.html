<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft 崩溃日志分析</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f0f5fc;
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app-container {
            max-width: 920px;
            width: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 32px 28px;
            box-shadow: 0 20px 50px -12px rgba(0,20,40,0.2);
            border: 1px solid rgba(255,255,255,0.6);
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0a2942;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        h1 i { color: #1f6bc0; }
        .subhead {
            color: #2b4b6a;
            margin-bottom: 28px;
            padding: 10px 16px;
            border-left: 4px solid #1f6bc0;
            background: rgba(31,107,192,0.06);
            border-radius: 0 16px 16px 0;
            font-size: 0.95rem;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
            background: #eaf1f9;
            padding: 20px 22px;
            border-radius: 32px;
            border: 1px solid #c9dcec;
            margin-bottom: 28px;
        }
        .settings-grid .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .settings-grid .field.full { grid-column: 1 / -1; }
        .settings-grid label {
            font-weight: 500;
            font-size: 0.85rem;
            color: #0a2942;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .settings-grid label i { color: #1f6bc0; width: 18px; }
        .settings-grid input, .settings-grid select {
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid #c9dcec;
            background: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
            appearance: auto;
        }
        .settings-grid input:focus, .settings-grid select:focus {
            border-color: #1f6bc0;
            box-shadow: 0 0 0 3px rgba(31,107,192,0.15);
        }
        .settings-grid input::placeholder { color: #9ab0c7; }

        /* 模型选择行 */
        .model-selector-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
            grid-column: 1 / -1;
        }
        .model-selector-row .field { grid-column: auto; }

        /* 平台 + 语言 双列 */
        .selector-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
            grid-column: 1 / -1;
        }
        .selector-row .field { grid-column: auto; }

        .log-area {
            background: #ffffffcc;
            border: 2px dashed #b6cfe5;
            border-radius: 32px;
            padding: 18px 20px;
            margin-bottom: 16px;
            position: relative;
        }
        .log-area textarea {
            width: 100%;
            height: 200px;
            border: none;
            background: transparent;
            resize: vertical;
            font-family: 'JetBrains Mono', 'Menlo', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #0a2942;
            outline: none;
        }
        .log-area textarea::placeholder { color: #9ab0c7; }

        .file-import-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding: 0 4px;
        }
        .file-import-row .btn {
            padding: 8px 20px;
            font-size: 0.9rem;
        }
        .file-import-row .file-name {
            color: #1f6bc0;
            font-weight: 500;
            font-size: 0.9rem;
            background: #eaf1f9;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid #c9dcec;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        #fileInput { display: none; }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
            justify-content: center;
        }
        .btn {
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            border: 1px solid #d0dfec;
            color: #1a3b54;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .btn i { font-size: 1rem; }
        .btn-primary { background: #1a4b75; border-color: #1a4b75; color: white; }
        .btn-primary:hover { background: #0f3a5c; transform: scale(1.02); }
        .btn-primary:disabled { opacity: 0.5; pointer-events: none; }
        .btn-success { background: #1f8b4c; border-color: #1f8b4c; color: white; }
        .btn-success:hover { background: #16733e; transform: scale(1.02); }
        .btn-outline { background: transparent; }
        .btn-outline:hover { background: #e3eef9; }
        .btn-danger { background: #b13e3e; border-color: #b13e3e; color: white; }
        .btn-danger:hover { background: #8f2e2e; }
        .btn-warning { background: #d48c2c; border-color: #d48c2c; color: white; }
        .btn-warning:hover { background: #b87622; transform: scale(1.02); }
        .btn-warning i { color: white; }

        .result-box {
            background: #f8fcff;
            border-radius: 28px;
            padding: 20px 24px;
            border: 1px solid #c9dcec;
            margin-top: 8px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .result-box .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .result-box .header h3 { font-weight: 600; color: #0a2942; font-size: 1.1rem; }
        .result-box .header .badge {
            background: #d4e3f0;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #1a3b54;
        }
        .result-box .content {
            background: #edf4fa;
            border-radius: 20px;
            padding: 16px 20px;
            max-height: 360px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.92rem;
            line-height: 1.7;
            color: #0a2942;
            border: 1px solid #d7e3ee;
        }

        .btn { min-width: 80px; }
        .test-result {
            display: none;
            padding: 12px 20px;
            border-radius: 28px;
            margin-bottom: 16px;
            font-weight: 500;
            align-items: center;
            gap: 12px;
            border: 1px solid transparent;
        }
        .test-result.show { display: flex; }
        .test-result.success { background: #e6f7ed; border-color: #87d4a8; color: #0f6e3a; }
        .test-result.error { background: #fde8e8; border-color: #f5a3a3; color: #a13535; }
        .test-result.loading { background: #eaf1f9; border-color: #b6cfe5; color: #1a4b75; }
        .test-result i { font-size: 1.2rem; }

        .footer-support {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 2px solid #dce8f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }
        .footer-support .support-text { color: #3e617e; font-size: 0.95rem; }
        .footer-support .support-text i { color: #e85d5d; margin: 0 4px; }
        .footer-support .bili-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #00a1d6;
            color: white;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: 0.2s;
            box-shadow: 0 6px 18px -6px #00a1d680;
        }
        .footer-support .bili-btn:hover { background: #0088b3; transform: scale(1.04); }
        .footer-support .bili-btn i { font-size: 1.6rem; }
        .footer-support .bili-btn .btn-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; }
        .footer-support .bili-btn .btn-text .sub { font-weight: 400; font-size: 0.7rem; opacity: 0.85; }

        @media (max-width: 600px) {
            .app-container { padding: 20px 14px; }
            .settings-grid { grid-template-columns: 1fr; }
            .model-selector-row { grid-template-columns: 1fr; }
            .selector-row { grid-template-columns: 1fr; }
            .footer-support .bili-btn { padding: 10px 24px; width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <h1><i class="fas fa-cube"></i> 崩溃日志分析</h1>
    <div class="subhead"><i class="fas fa-robot"></i> 选择AI模型，导入或粘贴日志，一键智能分析</div>

    <!-- 配置区域 -->
    <div class="settings-grid">
        <div class="field">
            <label><i class="fas fa-key"></i> API Key</label>
            <input type="password" id="apiKeyInput" placeholder="请输入你的 API Key" value="sk-proj-6B4wR4z1X9fG2kL7pQ3sT8yU5vM2nA6cD0eF1gH2jK3lZ8xY7wV4bN6mP9qR5sT">
        </div>
        <div class="field">
            <label><i class="fas fa-microchip"></i> 模型名称</label>
            <input type="text" id="modelNameInput" placeholder="模型名称" value="gpt-4o-mini">
        </div>
        <div class="model-selector-row">
            <div class="field">
                <label><i class="fas fa-list"></i> 选择 AI 服务</label>
                <select id="modelPresetSelect">
                    <option value="openai">OpenAI (GPT-4o / GPT-4o-mini)</option>
                    <option value="openai-gpt3">OpenAI (GPT-3.5-turbo)</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="claude">Anthropic Claude</option>
                    <option value="qwen">通义千问 (Qwen)</option>
                    <option value="glm">智谱 GLM-4</option>
                    <option value="moonshot">月之暗面 Moonshot</option>
                    <option value="custom">🔧 其他（自定义）</option>
                </select>
            </div>
            <div class="field">
                <label><i class="fas fa-plug"></i> API URL</label>
                <input type="text" id="portInput" placeholder="https://api.openai.com/v1/chat/completions" value="https://api.openai.com/v1/chat/completions">
            </div>
        </div>
        <div class="selector-row">
            <div class="field">
                <label><i class="fas fa-mobile-alt"></i> 运行平台</label>
                <select id="platformSelect">
                    <option value="自动识别（从日志中推断）">🔍 自动识别</option>
                    <option value="Windows PC（Java版/Forge/Fabric）">🖥️ Windows</option>
                    <option value="Android 手机（FCL / 澪 / 启动器）">📱 Android</option>
                    <option value="iOS 手机（PojavLauncher / 其他）">📱 iOS</option>
                    <option value="macOS">🍎 macOS</option>
                    <option value="Linux">🐧 Linux</option>
                </select>
            </div>
            <div class="field">
                <label><i class="fas fa-globe"></i> 输出语言</label>
                <select id="languageSelect">
                    <option value="简体中文">🇨🇳 简体中文</option>
                    <option value="日本語">🇯🇵 日本語</option>
                    <option value="English">🇬🇧 English</option>
                    <option value="Español">🇪🇸 Español</option>
                </select>
            </div>
        </div>
        <div class="field full">
            <label><i class="fas fa-user"></i> 系统提示</label>
            <input type="text" id="systemPromptInput" placeholder="你是一个Minecraft专家..." value="你是一个Minecraft崩溃分析专家，请根据崩溃日志给出可能的原因和解决方案。">
        </div>
    </div>

    <div class="test-result" id="testResult">
        <i class="fas fa-check-circle" id="testIcon"></i>
        <span id="testMessage">连接成功！</span>
    </div>

    <!-- 日志输入 -->
    <div class="file-import-row">
        <button class="btn btn-outline" id="importFileBtn"><i class="fas fa-file-import"></i> 导入 .txt 日志</button>
        <span class="file-name" id="fileNameDisplay">未选择文件</span>
        <button class="btn btn-outline" id="clearFileBtn" style="display:none;"><i class="fas fa-times"></i> 清除文件</button>
        <input type="file" id="fileInput" accept=".txt">
    </div>

    <div class="log-area">
        <textarea id="logInput" placeholder="在此粘贴 Minecraft 崩溃日志 (latest.log 或 crash-report) ... 也可以直接导入 .txt 文件"></textarea>
    </div>

    <div class="action-row">
        <button class="btn btn-warning" id="testBtn"><i class="fas fa-vial"></i> 测试连接</button>
        <button class="btn btn-outline" id="clearBtn"><i class="fas fa-eraser"></i> 清空</button>
        <button class="btn btn-outline" id="loadSampleBtn"><i class="fas fa-file-alt"></i> 示例日志</button>
        <button class="btn btn-primary" id="analyzeBtn"><i class="fas fa-brain"></i> 分析</button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="header">
            <h3><i class="fas fa-lightbulb" style="color: #e68a2e;"></i> 分析结果</h3>
            <span class="badge" id="resultBadge">AI 生成</span>
        </div>
        <div class="content" id="resultContent"></div>
    </div>

    <div class="footer-support">
        <div class="support-text">
            <i class="fas fa-heart"></i> 如果这个工具帮到了你，欢迎来我的 B 站主页逛逛 <i class="fas fa-heart"></i>
        </div>
        <a href="https://space.bilibili.com/3706938416171849" target="_blank" rel="noopener noreferrer" class="bili-btn">
            <i class="fab fa-bilibili"></i>
            <span class="btn-text">
                一滴有梦的露水
                <span class="sub">ROBLOX CHAIN玩家 · 点个关注吧</span>
            </span>
        </a>
    </div>
</div>

<script>
    (function() {
        "use strict";

        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelNameInput = document.getElementById('modelNameInput');
        const portInput = document.getElementById('portInput');
        const modelPresetSelect = document.getElementById('modelPresetSelect');
        const systemPromptInput = document.getElementById('systemPromptInput');
        const platformSelect = document.getElementById('platformSelect');
        const languageSelect = document.getElementById('languageSelect');
        const logInput = document.getElementById('logInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const testBtn = document.getElementById('testBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loadSampleBtn = document.getElementById('loadSampleBtn');
        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const resultBadge = document.getElementById('resultBadge');
        const testResult = document.getElementById('testResult');
        const testIcon = document.getElementById('testIcon');
        const testMessage = document.getElementById('testMessage');

        const importFileBtn = document.getElementById('importFileBtn');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const clearFileBtn = document.getElementById('clearFileBtn');
        let importedFileName = '';

        const MODEL_PRESETS = {
            'openai': { url: 'https://api.openai.com/v1/chat/completions', model: 'gpt-4o-mini' },
            'openai-gpt3': { url: 'https://api.openai.com/v1/chat/completions', model: 'gpt-3.5-turbo' },
            'deepseek': { url: 'https://api.deepseek.com/v1/chat/completions', model: 'deepseek-chat' },
            'gemini': { url: 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent', model: 'gemini-2.0-flash' },
            'claude': { url: 'https://api.anthropic.com/v1/messages', model: 'claude-3-5-sonnet-20241022' },
            'qwen': { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', model: 'qwen-plus' },
            'glm': { url: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4-flash' },
            'moonshot': { url: 'https://api.moonshot.cn/v1/chat/completions', model: 'moonshot-v1-8k' },
            'custom': { url: '', model: '' }
        };

        function saveSettings() {
            try {
                localStorage.setItem('mc_analyzer_apiKey', apiKeyInput.value);
                localStorage.setItem('mc_analyzer_model', modelNameInput.value);
                localStorage.setItem('mc_analyzer_port', portInput.value);
                localStorage.setItem('mc_analyzer_preset', modelPresetSelect.value);
                localStorage.setItem('mc_analyzer_system', systemPromptInput.value);
                localStorage.setItem('mc_analyzer_platform', platformSelect.value);
                localStorage.setItem('mc_analyzer_language', languageSelect.value);
            } catch (e) { /* ignore */ }
        }

        function loadSettings() {
            try {
                const key = localStorage.getItem('mc_analyzer_apiKey');
                const model = localStorage.getItem('mc_analyzer_model');
                const port = localStorage.getItem('mc_analyzer_port');
                const preset = localStorage.getItem('mc_analyzer_preset');
                const sys = localStorage.getItem('mc_analyzer_system');
                const platform = localStorage.getItem('mc_analyzer_platform');
                const lang = localStorage.getItem('mc_analyzer_language');
                if (key) apiKeyInput.value = key;
                if (model) modelNameInput.value = model;
                if (port) portInput.value = port;
                if (preset) modelPresetSelect.value = preset;
                if (sys) systemPromptInput.value = sys;
                if (platform) platformSelect.value = platform;
                if (lang) languageSelect.value = lang;
                applyPreset(modelPresetSelect.value);
            } catch (e) { /* ignore */ }
        }

        function applyPreset(presetKey) {
            const preset = MODEL_PRESETS[presetKey];
            if (!preset) return;
            if (presetKey === 'custom') return;
            if (preset.url) portInput.value = preset.url;
            if (preset.model) modelNameInput.value = preset.model;
        }

        function getConfig() {
            return {
                apiKey: apiKeyInput.value.trim(),
                model: modelNameInput.value.trim(),
                port: portInput.value.trim(),
                systemPrompt: systemPromptInput.value.trim() || '你是一个Minecraft崩溃分析专家，请根据崩溃日志给出可能的原因和解决方案。',
                platform: platformSelect.value,
                language: languageSelect.value
            };
        }

        async function testConnection() {
            const config = getConfig();
            if (!config.apiKey) { showTestResult(false, '❌ 请填写 API Key'); return; }
            if (!config.model) { showTestResult(false, '❌ 请填写模型名称'); return; }
            if (!config.port || !config.port.startsWith('http')) { showTestResult(false, '❌ 请填写有效的 API URL（含协议）'); return; }

            showTestResult('loading', '⏳ 正在测试连接...');
            testBtn.disabled = true;

            try {
                const response = await fetch(config.port, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [{ role: 'system', content: '你是一个助手。' }, { role: 'user', content: '回复"OK"表示连接正常。' }],
                        temperature: 0.1,
                        max_tokens: 10
                    })
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json(); errMsg = errData.error?.message || errMsg; } catch (e) { /* ignore */ }
                    throw new Error(`❌ 连接失败: ${errMsg}`);
                }
                const data = await response.json();
                const reply = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || '';
                if (reply.includes('OK') || reply.includes('ok') || reply.trim()) {
                    showTestResult(true, '✅ 连接成功！AI 服务正常工作 🎉');
                } else {
                    showTestResult(true, '✅ 连接成功，但返回内容异常。请尝试分析日志。');
                }
            } catch (error) {
                showTestResult(false, `❌ 测试失败: ${error.message}`);
            } finally {
                testBtn.disabled = false;
            }
        }

        function showTestResult(type, message) {
            testResult.className = 'test-result show';
            testResult.classList.remove('success', 'error', 'loading');
            if (type === 'success' || type === true) { testResult.classList.add('success'); testIcon.className = 'fas fa-check-circle'; }
            else if (type === 'error' || type === false) { testResult.classList.add('error'); testIcon.className = 'fas fa-times-circle'; }
            else if (type === 'loading') { testResult.classList.add('loading'); testIcon.className = 'fas fa-spinner fa-pulse'; }
            testMessage.textContent = message;
        }

        async function analyzeLog() {
            const log = logInput.value.trim();
            if (!log) { alert('请先粘贴日志或导入 .txt 文件'); return; }
            const config = getConfig();
            if (!config.apiKey) { alert('请填写 API Key'); return; }
            if (!config.model) { alert('请填写模型名称'); return; }
            if (!config.port || !config.port.startsWith('http')) { alert('请填写有效的 API URL (含协议)'); return; }

            saveSettings();

            let systemContent = config.systemPrompt;
            const langSuffix = { '简体中文': '所有回答必须使用简体中文。', '日本語': 'すべての回答は日本語で出力してください。', 'English': 'All responses must be in English.', 'Español': 'Todas las respuestas deben estar en español.' }[config.language] || '所有回答必须使用简体中文。';
            systemContent += ' ' + langSuffix;

            let userMessage = `请分析以下Minecraft崩溃日志，指出可能的原因和解决建议：\n\n${log}`;
            if (config.platform && !config.platform.includes('自动识别')) {
                userMessage += `\n\n注意：用户运行在 ${config.platform} 平台，请针对该平台给出具体的排查建议。`;
            }

            analyzeBtn.disabled = true;
            resultBox.style.display = 'none';
            resultContent.textContent = '';

            try {
                const response = await fetch(config.port, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${config.apiKey}` },
                    body: JSON.stringify({
                        model: config.model,
                        messages: [{ role: 'system', content: systemContent }, { role: 'user', content: userMessage }],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });
                if (!response.ok) {
                    let errMsg = `HTTP ${response.status}`;
                    try { const errData = await response.json(); errMsg = errData.error?.message || errMsg; } catch (e) { /* ignore */ }
                    throw new Error(`请求失败: ${errMsg}`);
                }
                const data = await response.json();
                let content = data.choices?.[0]?.message?.content || data.choices?.[0]?.text || data.content || '未获取到分析结果';
                if (!content || content.trim() === '') { content = '模型返回了空内容，请检查配置或重试。'; }
                resultContent.textContent = content;
                resultBox.style.display = 'flex';
                const platformLabel = config.platform.includes('自动识别') ? '自动' : config.platform.replace(/^[^\s]+\s/, '');
                resultBadge.textContent = `${config.language} · ${platformLabel} · ${config.model}`;
            } catch (error) {
                alert('分析失败: ' + error.message);
            } finally {
                analyzeBtn.disabled = false;
            }
        }

        function loadSampleLog() {
            logInput.value = `---- Minecraft Crash Report ----
// There are four lights!

Time: 2024-05-20 14:32:18
Description: Exception in server tick loop

java.lang.NullPointerException: Cannot invoke "net.minecraft.core.BlockPos.getX()" because "pos" is null
    at net.minecraft.server.level.ServerLevel.tick(ServerLevel.java:452)
    at net.minecraft.server.MinecraftServer.tickChildren(MinecraftServer.java:892)
    at net.minecraft.server.MinecraftServer.tickServer(MinecraftServer.java:844)
    at net.minecraft.server.MinecraftServer.runServer(MinecraftServer.java:678)
    at net.minecraft.server.MinecraftServer.main(MinecraftServer.java:598)

-- System Details --
Minecraft Version: 1.20.1
Operating System: Windows 10 (amd64) version 10.0
Java Version: 17.0.8, Microsoft
Memory: 1024 MB total, 256 MB free
Mods: fabric-loader-0.14.22, sodium-0.5.3, lithium-0.11.1`;
            importedFileName = '';
            fileNameDisplay.textContent = '未选择文件';
            clearFileBtn.style.display = 'none';
        }

        function clearAll() {
            logInput.value = '';
            resultBox.style.display = 'none';
            resultContent.textContent = '';
            importedFileName = '';
            fileNameDisplay.textContent = '未选择文件';
            clearFileBtn.style.display = 'none';
            fileInput.value = '';
            testResult.className = 'test-result';
        }

        function handleFileImport(file) {
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.txt')) {
                alert('请导入 .txt 格式的日志文件');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    logInput.value = e.target.result;
                    importedFileName = file.name;
                    fileNameDisplay.textContent = file.name;
                    clearFileBtn.style.display = 'inline-flex';
                } catch (err) {
                    alert('读取文件失败: ' + err.message);
                }
            };
            reader.onerror = () => alert('读取文件失败');
            reader.readAsText(file);
        }

        // 初始化
        function init() {
            loadSettings();

            modelPresetSelect.addEventListener('change', function() {
                applyPreset(this.value);
                saveSettings();
            });

            testBtn.addEventListener('click', testConnection);
            analyzeBtn.addEventListener('click', analyzeLog);
            clearBtn.addEventListener('click', clearAll);
            loadSampleBtn.addEventListener('click', loadSampleLog);

            importFileBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (fileInput.files.length > 0) {
                    handleFileImport(fileInput.files[0]);
                }
                fileInput.value = '';
            });
            clearFileBtn.addEventListener('click', () => {
                importedFileName = '';
                fileNameDisplay.textContent = '未选择文件';
                clearFileBtn.style.display = 'none';
            });

            logInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    analyzeBtn.click();
                }
            });

            [apiKeyInput, modelNameInput, portInput, systemPromptInput, platformSelect, languageSelect].forEach(el => {
                el.addEventListener('input', saveSettings);
                el.addEventListener('change', saveSettings);
            });

            applyPreset(modelPresetSelect.value);
        }

        init();
    })();
</script>
</body>
</html>
